name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # The official @deepseek-ai/* packages are peerDependencies, which npm does not
      # install by itself. Several tests import the real modules (the probe loads
      # `@deepseek-ai/dsh-llm`, the controller loads `dsh-session`), so without this
      # step every one of those suites dies on ERR_MODULE_NOT_FOUND — which is what
      # the first CI runs did.
      - run: npm install --no-audit --no-fund
      # The vendored primitives are checked in, but the merged bundle is
      # generated; rebuild so a stale lib/client.js cannot pass CI.
      - run: node tools/build-client.mjs
      - run: git diff --exit-code lib/client.js
      - run: node --check lib/client.js
      - run: node --check lib/index.js
      # A directory argument is not a test target: `node --test test/` tries to load
      # `test` as a module and fails with MODULE_NOT_FOUND. The glob is what the npm
      # script uses, so CI and `npm test` run the same set.
      - run: node --test test/*.test.js
      - run: node tools/probe-client.mjs
      - run: node tools/probe-client-static.mjs
      - run: node tools/probe-static.mjs
      # probe-host drives a fake Host context and imports the real DSH packages, so it
      # runs now that they are installed.
      - run: node tools/probe-host.mjs
