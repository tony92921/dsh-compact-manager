# dsh-compact-manager: context compaction, manual and automatic.
#
# One row owns all three engine entry points (compactRegion, compactIfNeeded,
# compactNow) and picks a strategy per call, so the model path and the
# mechanical fold cannot shadow each other.
#
# Keep @deepseek-ai/dsh-compaction-basic mounted: this plugin decorates the live
# engine instance instead of providing its own, so every official transaction
# marker, surface op and stability check still comes from the core.
- insert:
    - id: dsh-compact-manager
      name: dsh-compact-manager
