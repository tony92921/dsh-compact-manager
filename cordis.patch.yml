# dsh-compact-manager: one compaction plugin for both strategies.
#
# Replaces dsh-compact-saviour and dsh-ledger-compact. Both wrapped the same
# @deepseek-ai/dsh-compaction-basic engine, so only one of them could own
# compactRegion/compactNow at a time. This entry owns all three engine entry
# points and picks a strategy per call, which is why neither old row is kept.
#
# Keep @deepseek-ai/dsh-compaction-basic mounted: this plugin decorates the live
# engine instance instead of providing its own, so every official transaction
# marker, surface op and stability check still comes from the core.
- insert:
    - id: dsh-compact-manager
      name: dsh-compact-manager
